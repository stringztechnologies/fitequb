name: CI

on:
  pull_request:
    branches: [main]

env:
  SUPABASE_URL: "https://example.supabase.co"
  SUPABASE_ANON_KEY: "fake-key-for-ci"
  SUPABASE_SERVICE_ROLE_KEY: "fake-key-for-ci"
  TELEGRAM_BOT_TOKEN: "fake:token"
  CHAPA_SECRET_KEY: "fake-key"
  CHAPA_WEBHOOK_SECRET: "fake-secret"
  CRON_SECRET: "fake-secret"
  API_URL: "http://localhost:3000"
  TELEGRAM_MINI_APP_URL: "https://fitequb.com"
  PAYMENTS_ENABLED: "false"
  PILOT_CHECKOUT_ENABLED: "false"
  VITE_API_URL: "https://api.example.test"
  VITE_SUPABASE_URL: "https://example.supabase.co"
  VITE_SUPABASE_ANON_KEY: "fake-public-key-for-ci"

jobs:
  check:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run test --run

  pilot:
    name: Pilot database and browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitequb_pilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PILOT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitequb_pilot_test
      PILOT_TEST_REST_URL: http://127.0.0.1:55440
      PGRST_DB_URI: postgresql://postgres:postgres@127.0.0.1:5432/fitequb_pilot_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: pilot-test-secret-at-least-thirty-two-characters
      PGRST_SERVER_PORT: 55440
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitequb/shared build
      - name: Start isolated PostgREST
        run: |
          mkdir -p "$RUNNER_TEMP/pilot-rest"
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v16.2/postgrest-v16.2-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/pilot-rest/postgrest.tar.xz"
          echo "4712595baae0f5d84a527d55a11166d6bf4d9b0f1d102505c5e9d59219787f08  $RUNNER_TEMP/pilot-rest/postgrest.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/pilot-rest/postgrest.tar.xz" -C "$RUNNER_TEMP/pilot-rest"
          "$RUNNER_TEMP/pilot-rest/postgrest" > "$RUNNER_TEMP/pilot-rest/server.log" 2>&1 &
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pilot-browser

  containers:
    name: Container builds and health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t fitequb-api:ci .
          docker build -f apps/bot/Dockerfile -t fitequb-bot:ci .
          docker build -f apps/web/Dockerfile -t fitequb-web:ci \
            --build-arg VITE_API_URL=https://api.example.test \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=fake-public-key-for-ci .
      - name: Prove missing web build variables fail
        run: |
          if docker build -f apps/web/Dockerfile -t fitequb-web:invalid .; then
            echo "Web image unexpectedly built without production variables"
            exit 1
          fi
      - name: Run API and web health probes
        run: |
          mkdir -p "$RUNNER_TEMP/readiness/rest/v1"
          touch "$RUNNER_TEMP/readiness/rest/v1/equb_rooms"
          python3 -m http.server 55441 --directory "$RUNNER_TEMP/readiness" > "$RUNNER_TEMP/readiness.log" 2>&1 &
          docker run -d --name fitequb-api --add-host host.docker.internal:host-gateway \
            -e SUPABASE_URL=http://host.docker.internal:55441 \
            -e SUPABASE_SERVICE_ROLE_KEY=fake-key \
            -e TELEGRAM_BOT_TOKEN=fake:token \
            -e QR_SECRET=test-only-qr-secret \
            -e PAYMENTS_ENABLED=false \
            -p 3000:3000 fitequb-api:ci
          docker run -d --name fitequb-web -p 8080:80 fitequb-web:ci
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:3000/health/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health/ready
          curl -fsS http://127.0.0.1:8080/health
          for attempt in {1..30}; do
            test "$(docker inspect --format '{{.State.Health.Status}}' fitequb-api)" = healthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' fitequb-api)" = healthy
          for attempt in {1..30}; do
            test "$(docker inspect --format '{{.State.Health.Status}}' fitequb-web)" = healthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' fitequb-web)" = healthy
      - name: Smoke bot artifact
        run: docker run --rm --entrypoint node fitequb-bot:ci --check apps/bot/dist/index.js
