name: CI

on:
  pull_request:
    branches: [main]

env:
  SUPABASE_URL: "https://example.supabase.co"
  SUPABASE_ANON_KEY: "fake-key-for-ci"
  SUPABASE_SERVICE_ROLE_KEY: "fake-key-for-ci"
  TELEGRAM_BOT_TOKEN: "fake:token"
  CHAPA_SECRET_KEY: "fake-key"
  CHAPA_WEBHOOK_SECRET: "fake-secret"
  CRON_SECRET: "fake-secret"
  API_URL: "http://localhost:3000"
  TELEGRAM_MINI_APP_URL: "https://fitequb.com"

jobs:
  check:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run test --run

  pilot:
    name: Pilot database and browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitequb_pilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PILOT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitequb_pilot_test
      PILOT_TEST_REST_URL: http://127.0.0.1:55440
      PGRST_DB_URI: postgresql://postgres:postgres@127.0.0.1:5432/fitequb_pilot_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: pilot-test-secret-at-least-thirty-two-characters
      PGRST_SERVER_PORT: 55440
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitequb/shared build
      - name: Start isolated PostgREST
        run: |
          mkdir -p "$RUNNER_TEMP/pilot-rest"
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v16.2/postgrest-v16.2-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/pilot-rest/postgrest.tar.xz"
          tar -xJf "$RUNNER_TEMP/pilot-rest/postgrest.tar.xz" -C "$RUNNER_TEMP/pilot-rest"
          "$RUNNER_TEMP/pilot-rest/postgrest" > "$RUNNER_TEMP/pilot-rest/server.log" 2>&1 &
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pilot-browser
